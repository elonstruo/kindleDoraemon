<script>
// ========== 时间日期 ==========
// Kindle 7 的系统时区可能不准，强制按北京时间（UTC+8）显示。
function getChinaTime() {
    var now = new Date();
    var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    return new Date(utc + (8 * 60 * 60 * 1000));
}

function updateTime() {
    var now = getChinaTime();
    var h = now.getHours();
    var m = now.getMinutes();
    h = h < 10 ? '0' + h : h;
    m = m < 10 ? '0' + m : m;
    document.getElementById('time').innerText = h + ':' + m;

    var y = now.getFullYear();
    var mo = now.getMonth() + 1;
    var d = now.getDate();
    mo = mo < 10 ? '0' + mo : mo;
    d = d < 10 ? '0' + d : d;
    document.getElementById('date').innerText = y + '-' + mo + '-' + d;

    var weeks = [
        {cn: '星期日', ja: '日曜日'},
        {cn: '星期一', ja: '月曜日'},
        {cn: '星期二', ja: '火曜日'},
        {cn: '星期三', ja: '水曜日'},
        {cn: '星期四', ja: '木曜日'},
        {cn: '星期五', ja: '金曜日'},
        {cn: '星期六', ja: '土曜日'}
    ];
    var week = weeks[now.getDay()];
    document.getElementById('week').innerText = week.cn + '（' + week.ja + '）';
}
var lastDailyKey = null;

function refreshDailyContentIfNeeded() {
    // 如果 DOM 尚未准备好，延迟执行以避免触发表现差异
    if (document.readyState === 'loading') {
        window.addEventListener('load', refreshDailyContentIfNeeded);
        return;
    }

    var dayKey = getChinaDayKey();
    if (lastDailyKey === dayKey) {
        return;
    }
    lastDailyKey = dayKey;
    randomItem();
    randomQuote();
    // 在某些旧浏览器（如 Kindle7 的旧 WebKit）上，脚本修改内容后需要强制修正宽度
    if (typeof forceFullWidth === 'function') {
        // 小延迟以确保 DOM 变更完成再触发重排
        setTimeout(forceFullWidth, 30);
    }
}

function getChinaDayKey() {
    var now = getChinaTime();
    var y = now.getFullYear();
    var mo = now.getMonth() + 1;
    var d = now.getDate();
    mo = mo < 10 ? '0' + mo : mo;
    d = d < 10 ? '0' + d : d;
    return y + '-' + mo + '-' + d;
}

function hashString(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
    }
    return hash;
}

function getDailyIndex(key, total) {
    var dayKey = getChinaDayKey();
    var salt = key + ':' + dayKey;
    var idx = hashString(salt) % total;
    return idx;
}

function setQuoteByIndex(idx) {
    var quote = quotes[idx];
    document.getElementById('quote').innerText = quote.text;
    document.getElementById('quoteAuthor').innerText =
        '—— ' + quote.author + ' · ' + quote.source;
}

function randomQuote() {
    var idx = getDailyIndex('quote', quotes.length);
    setQuoteByIndex(idx);
}

function manualRandomQuote() {
    var idx = Math.floor(Math.random() * quotes.length);
    setQuoteByIndex(idx);
    // forceFullWidth();
}

// 强制页面在部分旧浏览器（如 Kindle 7 的 WebKit）上填满视口宽度
function forceFullWidth() {
    try {
        document.documentElement.style.width = '100%';
        document.body.style.width = '100%';
        var cp = document.querySelector('.comic-page');
        if (cp) {
            cp.style.width = '100%';
            cp.style.maxWidth = 'none';
            cp.style.margin = '0';
            // 触发重排
            void cp.offsetWidth;
        }
    } catch (e) {
        // ignore
    }
}
