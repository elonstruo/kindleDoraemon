<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画图鉴</title>
<style>
/* ========== 全局 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fff;
    color: #000;
    padding: 8px;
    line-height: 1.6;
}

/* ========== 整页漫画外框 ========== */
.comic-page {
    border: 5px solid #000;
    padding: 10px;
    position: relative;
    min-height: 96vh;
}

.page-number {
    position: absolute;
    top: -14px;
    right: 16px;
    background: #fff;
    border: 3px solid #000;
    padding: 2px 10px;
    font-size: 13px;
    font-weight: bold;
    z-index: 10;
}

/* ========== 漫画分镜容器 ========== */
.panels {
    display: flex;
    flex-direction: column;
}

/* 通用分格 */
.panel {
    border: 3px solid #000;
    padding: 12px;
    position: relative;
    background: #fff;
    margin-bottom: -3px;
}

.panel:last-child {
    margin-bottom: 0;
}

/* 分格标题小黑条 */
.panel-tag {
    display: inline-block;
    background: #000;
    color: #fff;
    padding:3px 10px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

/* ========== 第一格：时间 ========== */
.time-panel {
    text-align: center;
    padding: 10px 12px 12px;
}

.time-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
}

.time-big {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1;
    text-shadow:
        2px 0 0 #000, -2px 0 0 #000,
        0 2px 0 #000, 0 -2px 0 #000;
    color: #fff;
}

.date-side {
    text-align: left;
    border-left: 3px solid #000;
    padding-left: 12px;
}

.date-side .date-main {
    font-size: 17px;
    font-weight: bold;
    line-height: 1.4;
}

.date-side .date-week {
    font-size: 14px;
    font-weight: bold;
    border-top: 2px solid #000;
    margin-top: 4px;
    padding-top: 4px;
}

/* ========== 第二格：今日道具 ========== */
.item-panel {
    padding: 12px;
}

.item-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    border-bottom: 4px double #000;
    padding-bottom: 6px;
}

.item-name {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 2px;
}

.item-no {
    font-size: 13px;
    font-weight: bold;
    border: 2px solid #000;
    padding: 2px 8px;
}

/* 道具图文区：左右分栏 */
.item-body {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.item-image-box {
    flex-shrink: 0;
    width: 240px;
    border: 3px solid #000;
    padding: 6px;
    text-align: center;
}

.item-image-box img {
    max-width: 100%;
    height: auto;
    display: block;
    filter: contrast(140%);
    margin: 0 auto;
}

.item-text {
    flex: 1;
    min-width: 0;
}

/* 描述对话框 */
.item-desc-bubble {
    border: 3px solid #000;
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 15px;
    font-weight: bold;
    line-height: 1.6;
    position: relative;
    margin-bottom: 10px;
}

/* 气泡小尾巴指向图片 */
.item-desc-bubble::after {
    content: "";
    position: absolute;
    left: -12px;
    top: 16px;
    width: 0;
    height: 0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-right: 12px solid #000;
}

.item-desc-bubble::before {
    content: "";
    position: absolute;
    left: -8px;
    top: 18px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 9px solid #fff;
    z-index: 1;
}
/* 出处注释 */
.item-source-box {
    border: 2px solid #000;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.5;
    position: relative;
}

.item-source-box::before {
    content: "出处";
    position: absolute;
    top: -9px;
    left: 8px;
    background: #000;
    color: #fff;
    font-size: 10px;
    padding: 1px 6px;
    font-weight: bold;
}

/* ========== 第三格：每日一句 ========== */
.quote-panel {
    padding: 12px 14px 14px;
}
/* 语录作者行 */
.quote-meta {
    text-align: right;
    margin-top: 18px;
}

.quote-author {
    font-size: 14px;
    font-weight: bold;
}
.speech-bubble {
    position: relative;
    border: 3px solid #000;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.6;
}

.speech-bubble::after {
    content: "";
    position: absolute;
    bottom: -12px;
    right: 36px;
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 12px solid #000;
}

.speech-bubble::before {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 39px;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 9px solid #fff;
    z-index: 1;
}

    font-weight: bold;
    letter-spacing: 1px;
} */

/* ========== 刷新按钮栏 ========== */
.refresh-bar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.refresh-btn {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    font-weight: 900;
    background: #fff;
    color: #000;
    border: 3px solid #000;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    box-shadow: 3px 3px 0 #000;
}

.refresh-btn:active {
    transform: translate(3px, 3px);
    box-shadow: none;
}
/* ========== 底部 ========== */
.comic-footer {
    text-align: center;
    font-size: 11px;
    font-weight: bold;
    padding: 8px 0 2px;
    border-top: 3px double #000;
    margin-top: 10px;
    letter-spacing: 3px;
}
</style>
</head>

<script>
// ========== 时间日期 ==========
function updateTime() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    h = h < 10 ? '0' + h : h;
    m = m < 10 ? '0' + m : m;
    document.getElementById('time').innerText = h + ':' + m;

    var y = now.getFullYear();
    var mo = now.getMonth() + 1;
    var d = now.getDate();
    mo = mo < 10 ? '0' + mo : mo;
    d = d < 10 ? '0' + d : d;
    document.getElementById('date').innerText = y + '年' + mo + '月' + d + '日';

    var weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    document.getElementById('week').innerText = weeks[now.getDay()];
}
updateTime();
setInterval(updateTime, 30000);

function randomItem() {
    var idx = Math.floor(Math.random() * doraemonItems.length);
    var item = doraemonItems[idx];
    document.getElementById('itemNo').innerText = item.no;
    document.getElementById('itemName').innerText = item.name;
    document.getElementById('itemImg').src = item.img;
    document.getElementById('itemDesc').innerText = item.desc;
    document.getElementById('itemSource').innerHTML = item.source;
}

// ========== 按钮事件 ==========
document.getElementById('refreshItem').addEventListener('click', randomItem);
document.getElementById('refreshQuote').addEventListener('click', randomQuote);
document.getElementById('refreshAll').addEventListener('click', function() {
    randomItem();
    randomQuote();
});

// 初始化
// randomItem();
// randomQuote();
// Load doraemonItems from dierji/data_valid.json and overwrite runtime data
(function(){
  var jsonPath = 'dierji/data_valid.json';
  function normalize(it){
    return {
      no: it.no || '',
      name: it.name || '',
      desc: it.desc || it.description || '',
      img: it.img_filename || it.image_url || it.img || '',
      source: it.source || ''
    };
  }
  function apply(data){
    if(!Array.isArray(data) || !data.length) return;
    try{ window.doraemonItems = data.map(normalize); }catch(e){ window.doraemonItems = data; }
    try{
      var idx = (typeof getDailyIndex === 'function') ? getDailyIndex('item', window.doraemonItems.length) : Math.floor(Math.random()*window.doraemonItems.length);
      var item = window.doraemonItems[idx];
      if(item){
        var el;
        el = document.getElementById('itemName'); if(el) el.innerText = item.name;
        el = document.getElementById('itemDesc'); if(el) el.innerText = item.desc;
        el = document.getElementById('itemImg'); if(el && item.img) el.src = item.img;
        el = document.getElementById('itemNo'); if(el) el.innerText = item.no || '';
        el = document.getElementById('itemSource'); if(el) el.innerHTML = item.source || '';
      }
    }catch(e){}
  }
  function fetchJson(){
    if(window.fetch){
      fetch(jsonPath).then(function(r){ if(!r.ok) throw new Error('Network error'); return r.json(); }).then(apply).catch(function(){ xhrLoad(); });
    } else { xhrLoad(); }
  }
  function xhrLoad(){
    try{
      var xhr = new XMLHttpRequest();
      xhr.open('GET', jsonPath, true);
      xhr.onreadystatechange = function(){ if(xhr.readyState===4 && (xhr.status===200 || xhr.status===0)){ try{ var d = JSON.parse(xhr.responseText); apply(d);}catch(e){} } };
      xhr.send(null);
    }catch(e){}
  }
  fetchJson();
})();
